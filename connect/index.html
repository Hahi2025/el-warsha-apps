tionist", "You’re welcome. We’ll be expecting you in an hour.", "على الرحب والسعة. سنكون بانتظارك خلال ساعة."]]}, {"title": "الرأي والتفضيل في خطط السفر", "en": "Expressing Opinion & Preference", "icon": "chat", "lines": [["Sami", "Where do you prefer to go for our holiday, Abha or Jeddah?", "إلى أين تفضل أن نذهب في إجازتنا، أبها أم جدة؟"], ["Tariq", "In my opinion, Abha is better if you don’t mind cool weather in the summer.", "في رأيي أبها أفضل إذا كنت لا تمانع الطقس المعتدل في الصيف."], ["Sami", "I completely agree! I’d rather enjoy the mountain views and cool breeze.", "أتفق تمامًا! أفضل الاستمتاع بمناظر الجبال والنسيم البارد."], ["Tariq", "Great! Let’s book our flight tickets today.", "رائع! لنحجز تذاكر الطيران اليوم."]]}, {"title": "الاتفاق والاختلاف حول موعد مشروع", "en": "Agreeing & Disagreeing", "icon": "calendar", "lines": [["Mona", "Why don’t we meet tomorrow afternoon to finish our presentation?", "لماذا لا نلتقي غدًا بعد الظهر لننهي عرضنا التقديمي؟"], ["Noura", "I’m afraid I disagree. I have a supervisor meeting scheduled at that time.", "أخشى أنني أختلف معك. لدي اجتماع مع المشرف في ذلك الوقت."], ["Mona", "Oh, I see. Can you make it on Thursday morning instead?", "فهمت. هل يناسبك صباح الخميس بدلًا من ذلك؟"], ["Noura", "Yes, Thursday morning works perfectly for me! Let’s do that.", "نعم، صباح الخميس يناسبني تمامًا! لنتفق على ذلك."]]}, {"title": "التوديع وإرسال التحيات", "en": "Farewell & Sending Regards", "icon": "chat", "lines": [["Khaled", "It was wonderful catching up with you, Bander, but I have to go now.", "كان من الرائع تبادل الأخبار معك يا بندر، لكن عليّ الذهاب الآن."], ["Bander", "Glad to see you too, Khaled. Have a great time in Riyadh!", "وأنا سعيد برؤيتك يا خالد. أتمنى لك وقتًا رائعًا في الرياض!"], ["Khaled", "Thanks! Please say ‘hello’ to your parents for me and give them my best regards.", "شكرًا! سلّم لي على والديك وأبلغهما أطيب تحياتي."], ["Bander", "I surely will. See you soon! Bye!", "سأفعل بالتأكيد. أراك قريبًا! وداعًا!"]]}]};
const icons={book:'<path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4z"/><path d="M13 7a3 3 0 0 1 3-3h5v15h-4a4 4 0 0 0-4 2"/>',home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',chat:'<path d="M21 11a8 8 0 0 1-8 8H7l-4 3V11a9 9 0 0 1 18 0Z"/><path d="M7 10h10M7 14h6"/>',star:'<path d="m12 3 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>',sound:'<path d="M4 9h4l5-4v14l-5-4H4zM17 8a6 6 0 0 1 0 8M20 5a10 10 0 0 1 0 14"/>',check:'<path d="m5 12 4 4L20 5"/>',arrow:'<path d="m14 5-7 7 7 7M7 12h14"/>',back:'<path d="m10 5 7 7-7 7M17 12H3"/>',chart:'<path d="M4 20h17M7 17v-5M12 17V4M17 17V8"/>',quiz:'<rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 3h6v4H9zM9 12h6M9 16h4"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/>',plane:'<path d="m21 3-6 18-4-8-8-4zM11 13 21 3"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 11h18M8 15h2M14 15h2"/>',cards:'<rect x="6" y="5" width="14" height="17" rx="3"/><path d="M15 2H5a3 3 0 0 0-3 3v12"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>'};
function ico(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[n]||icons.book)+'</svg>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const KEY='warsha-connect-v1',blank=()=>({known:[],favorites:[],dialogs:[],attempts:[],mistakes:[],dark:false,large:false,rate:.85,voice:'',name:''});let state=blank();try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.known)&&Array.isArray(s.attempts))state={...state,...s}}catch(e){}
let storageWarn=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){if(!storageWarn){toast('تعذر حفظ التقدم؛ يمكنك تصدير تقريرك.');storageWarn=true}}}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',3500)}
let page='home',cat='all',filter='all',query='',flashItems=[],fi=0,flipped=false,quiz=null,dialogIndex=0,role='',showAr=true,revealed=new Set(),speakToken=0;
const cats=['السفر والمطار','التعارف والتحيات','المواعيد','الرأي والتفضيل','مهارات التواصل'];
function apply(){document.body.classList.toggle('dark',state.dark);document.body.classList.toggle('large',state.large)}apply();
function stop(){speakToken++;if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function speak(text,done){if(!('speechSynthesis'in window)){toast('النطق الصوتي غير متاح في هذا المتصفح.');return}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=state.rate;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.name===state.voice)||voices.find(v=>v.lang.startsWith('en'))||null;u.onend=()=>done&&done();u.onerror=()=>toast('تعذر تشغيل الصوت. جرّب صوتًا آخر أو متصفحًا آخر.');speechSynthesis.speak(u)}
function say(t){stop();speak(t)}function sayWord(id){say(DATA.vocab[id].en)}function sayExpr(g,i){say(DATA.expressions[g].items[i].en)}function sayLine(i){say(DATA.dialogs[dialogIndex].lines[i][1])}
function go(p){stop();page=p;render();window.scrollTo(0,0)}function head(title,sub){return `<div class="topline"><button class="iconbtn" onclick="go('home')" aria-label="العودة للرئيسية">${ico('back')}</button><div><h1>${title}</h1><p class="sub">${sub}</p></div></div>`}function btn(label,fn,kind='primary',icon=''){return `<button class="${kind}" onclick="${esc(fn)}">${icon?ico(icon):''}${label}</button>`}
function render(){apply();let nav=[['home','home','الرئيسية'],['vocab','book','الكلمات'],['dialogs','chat','المحادثات'],['practice','quiz','التدريب'],['progress','chart','تقدمي']];document.getElementById('nav').innerHTML=nav.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')" ${page===p?'aria-current="page"':''}>${ico(i)}${t}</button>`).join('');document.getElementById('main').innerHTML=({home:home,vocab:vocabPage,expressions:exprPage,dialogs:dialogsPage,conversation:conversation,practice:practicePage,flash:flashPage,quiz:quizPage,progress:progressPage,settings:settingsPage})[page]();if(page==='vocab')renderWords();if(page==='settings')populateVoices()}
function home(){let n=state.known.length;return `<div class="eyebrow">CONNECT • ENGLISH IN REAL LIFE</div><h1>كلمات تتحول<br>إلى محادثات.</h1><p class="sub" style="margin-top:7px">تعلم، استمع، ثم جرّب بنفسك.</p><div class="hero"><div class="eyebrow">خطوتك التالية</div><h2>${n?'واصل التدريب':'ابدأ بثقة'}</h2><p>راجع المفردات في بطاقات قصيرة، ثم استخدمها في موقف حقيقي.</p>${btn('ابدأ مراجعة الكلمات',"startFlash('all')",'primary','arrow')}</div><div class="stats"><div class="stat"><strong>50</strong><span>كلمة وتعبير</span></div><div class="stat"><strong>5</strong><span>محادثات عملية</span></div><div class="stat"><strong>${n}/50</strong><span>كلمات راجعتها</span></div></div><div class="sectionhead"><h2>مساحة التعلم</h2><span class="sub">اختر ما تحتاجه</span></div><div class="grid">${[['vocab','book','قاموس الكلمات','المعنى، السياق والنطق'],['expressions','chat','عبارات جاهزة','للمواقف اليومية'],['dialogs','plane','محادثات عملية','استمع وتدرّب على دورك'],['practice','quiz','اختبر نفسك','معاني، استماع ومواقف']].map(([p,i,t,s])=>`<button class="tile" onclick="go('${p}')"><span class="tileicon">${ico(i)}</span><h3>${t}</h3><small>${s}</small></button>`).join('')}</div><div class="sectionhead"><h2>رحلة تعلمك</h2><button class="sub" onclick="go('progress')">عرض التقدم ←</button></div><div class="card"><div class="row"><span>مراجعة المفردات</span><strong>${Math.round(n/50*100)}%</strong></div><div class="progress"><i style="width:${n/50*100}%"></i></div><p class="sub" style="margin-top:10px">المراجعة الذاتية خطوة أولى؛ الاختبار يساعدك على التحقق من فهمك.</p></div><footer>مبني على محتوى 30-9.pdf • الورشة أكاديمي</footer>`}
function vocabPage(){return head('قاموس الكلمات','50 مفردة من محتوى الدرس')+`<input class="search" id="search" placeholder="ابحث بكلمة إنجليزية أو بمعناها…" aria-label="البحث في الكلمات" value="${esc(query)}" oninput="query=this.value;renderWords()"><div class="chips">${['all',0,1,2,3,4].map(c=>`<button class="chip ${cat===c?'active':''}" onclick="cat=${typeof c==='string'?"'all'":c};render()">${c==='all'?'الكل':cats[c]}</button>`).join('')}</div><div class="chips">${[['all','جميع الكلمات'],['favorites','المفضلة'],['new','لم أراجعها'],['known','راجعتها']].map(([f,t])=>`<button class="chip ${filter===f?'active':''}" onclick="filter='${f}';render()">${t}</button>`).join('')}</div><div class="row"><span class="sub" id="count"></span>${btn('بطاقات هذه القائمة','startFlash("filtered")','secondary','cards')}</div><div id="words"></div>`}
function filtered(){return DATA.vocab.filter(w=>(cat==='all'||w.cat===cat)&&(filter==='all'||filter==='favorites'&&state.favorites.includes(w.id)||filter==='known'&&state.known.includes(w.id)||filter==='new'&&!state.known.includes(w.id))&&(`${w.en} ${w.ar} ${w.context}`.toLowerCase().includes(query.trim().toLowerCase())))}
function renderWords(){let arr=filtered();document.getElementById('count').textContent=arr.length+' كلمة';document.getElementById('words').innerHTML=arr.length?arr.map(w=>`<article class="card wordcard"><div class="row"><div><span class="sub">${String(w.id+1).padStart(2,'0')} • ${cats[w.cat]}</span><h2 class="en word" lang="en">${esc(w.en)}</h2></div><div class="actions"><button class="iconbtn" aria-label="نطق ${esc(w.en)}" onclick="sayWord(${w.id})">${ico('sound')}</button><button class="iconbtn ${state.favorites.includes(w.id)?'known':''}" aria-label="إضافة للمفضلة" aria-pressed="${state.favorites.includes(w.id)}" onclick="toggleWord('favorites',${w.id})">${ico('star')}</button></div></div><p class="meaning">${w.ar}</p><p class="context">${w.context}</p><button class="chip ${state.known.includes(w.id)?'known':''}" style="margin-top:12px" onclick="toggleWord('known',${w.id})">${state.known.includes(w.id)?'✓ راجعتها':'علّمها كمراجَعة'}</button></article>`).join(''):'<div class="empty">لا توجد كلمات هنا. جرّب تغيير البحث أو الفلتر.</div>'}
function toggleWord(k,id){state[k]=state[k].includes(id)?state[k].filter(i=>i!==id):[...state[k],id];save();renderWords()}
function exprPage(){return head('عبارات جاهزة','تعبيرات التواصل الواردة في الملف')+DATA.expressions.map((g,gi)=>`<section class="card"><h2>${g.ar}</h2><p class="sub en" lang="en">${g.en}</p>${g.items.map((e,i)=>`<div style="border-top:1px solid var(--line);padding-top:14px;margin-top:14px"><div class="row"><p class="en" lang="en" style="flex:1">${esc(e.en)}</p><button class="iconbtn" aria-label="استمع للعبارة" onclick="sayExpr(${gi},${i})">${ico('sound')}</button></div><p class="meaning">${e.ar}</p></div>`).join('')}</section>`).join('')+'<div class="note">الشرطات المائلة تفصل بين بدائل للتعبير. اختر صيغة واحدة تناسب الموقف. أكمل (…) بالاسم أو التفاصيل المناسبة.</div>'}
function dialogsPage(){return head('محادثات عملية','استمع، افهم، ثم تبادل الأدوار')+DATA.dialogs.map((d,i)=>`<button class="card" style="width:100%;text-align:right" onclick="openDialog(${i})"><div class="row"><span class="tileicon" style="margin:0">${ico(d.icon)}</span><div style="flex:1"><span class="sub">محادثة ${i+1} • ${d.lines.length} مقاطع</span><h2>${d.title}</h2><p class="sub en" lang="en">${d.en}</p></div>${state.dialogs.includes(i)?'<span class="pill">تدرّبت</span>':ico('arrow')}</div></button>`).join('')+'<div class="note">طريقة التدريب: استمع مرة، اختر شخصيتك، أخفِ نص دورك وحاول الرد بصوتك، ثم اكشف الجملة للمقارنة.</div>'}
function openDialog(i){dialogIndex=i;role='';showAr=true;revealed=new Set();go('conversation')}
function conversation(){const d=DATA.dialogs[dialogIndex],roles=[...new Set(d.lines.map(l=>l[0]))];return head(d.title,d.en)+`<div class="controls"><div class="row wrap">${btn('استمع للمحادثة','playDialog()','secondary','sound')}<button class="iconbtn" onclick="stop()" aria-label="إيقاف الصوت">${ico('stop')}</button><button class="chip" onclick="showAr=!showAr;render()">${showAr?'إخفاء الترجمة':'إظهار الترجمة'}</button></div><label class="sub" for="role">تدرّب على دور:</label> <select id="role" class="select" onchange="role=this.value;revealed.clear();stop();render()"><option value="">عرض جميع الأدوار</option>${roles.map(r=>`<option ${role===r?'selected':''} value="${r}">${r}</option>`).join('')}</select></div>${role?'<div class="note">نص دورك مخفي. استمع للشخصية الأخرى، ثم قل ردك واكشف الجملة. هذا تدريب ذاتي دون تقييم آلي للنطق.</div>':''}${d.lines.map(([r,en,ar],i)=>{let hidden=role===r&&!revealed.has(i);return `<article class="bubble ${i%2?'alt':''}"><div class="row"><span class="speaker" lang="en">${r}</span>${hidden?'':`<button class="iconbtn" aria-label="نطق الجملة" onclick="sayLine(${i})">${ico('sound')}</button>`}</div>${hidden?`<p class="sub" style="margin:12px 0">دورك الآن… حاول الرد بالإنجليزية.</p>${btn('اكشف الجملة',`revealed.add(${i});render()`,'secondary')}`:`<p class="en" lang="en">${esc(en)}</p>${showAr?`<p class="translation">${ar}</p>`:''}`}</article>`}).join('')}`+btn(state.dialogs.includes(dialogIndex)?'✓ تم تسجيل التدريب':'أنهيت التدريب على المحادثة','markDialog()')+`<button class="secondary" style="width:100%;margin-top:10px" onclick="go('dialogs')">بقية المحادثات</button>`}
function playDialog(){stop();const token=speakToken;let lines=DATA.dialogs[dialogIndex].lines.filter(l=>l[0]!==role),i=0;function next(){if(token!==speakToken||i===lines.length)return;speak(lines[i++][1],next)}next()}function markDialog(){if(!state.dialogs.includes(dialogIndex))state.dialogs.push(dialogIndex);save();toast('تم تسجيل التدريب على المحادثة');render()}
function practicePage(){return head('تدريب واختبارات','تعلّم من كل محاولة')+`<div class="card"><div class="tileicon">${ico('cards')}</div><h2>بطاقات المراجعة</h2><p class="sub">تذكر المعنى قبل قلب البطاقة. حدّد الكلمات التي تحتاج مراجعة.</p><div class="stack">${btn('راجع جميع الكلمات',"startFlash('all')")}${btn('راجع المفضلة',"startFlash('favorites')",'secondary')}${btn('راجع أخطائي',"startFlash('mistakes')",'secondary')}</div></div><div class="card"><h2>اختر نوع التحدي</h2><p class="sub">10 أسئلة جديدة في كل محاولة؛ النتيجة من الإجابة الأولى.</p><div class="stack">${btn('اختبار معاني الكلمات',"startQuiz('meaning')",'secondary','book')}${btn('تحدي الاستماع',"startQuiz('listen')",'secondary','sound')}${btn('ماذا تقول في هذا الموقف؟',"startQuiz('situations')",'secondary','chat')}</div></div><div class="note">تدريبات التطبيق إضافات مبنية على محتوى الملف. نتائجها تقيس إجاباتك داخل التطبيق ولا تمثل تقييمًا رسميًا لمستواك.</div>`}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function startFlash(mode){let arr=mode==='filtered'?filtered():mode==='favorites'?DATA.vocab.filter(w=>state.favorites.includes(w.id)):mode==='mistakes'?DATA.vocab.filter(w=>state.mistakes.includes(w.id)):DATA.vocab;if(!arr.length){toast('لا توجد كلمات في هذه القائمة بعد.');return}flashItems=shuffle(arr);fi=0;flipped=false;go('flash')}
function flashPage(){let w=flashItems[fi];if(!w)return head('المراجعة مكتملة','خطوة جديدة نحو تواصل أفضل')+`<div class="card"><h2>انتهيت من هذه المجموعة ✓</h2><p class="sub">الكلمات التي تحتاج مراجعة متاحة في قائمة «أخطائي».</p></div>${btn('اختبر فهمك',"startQuiz('meaning')")}${btn('العودة للتدريب',"go('practice')",'secondary')}`;return head('بطاقات المراجعة','حاول تذكر المعنى قبل كشفه')+`<div class="row"><span class="pill">${fi+1} / ${flashItems.length}</span><button class="iconbtn" onclick="sayWord(${w.id})" aria-label="استمع للكلمة">${ico('sound')}</button></div><div class="progress"><i style="width:${fi/flashItems.length*100}%"></i></div><button class="flash" onclick="flipped=!flipped;render()" aria-label="قلب البطاقة"><span class="sub">${cats[w.cat]}</span><span class="en word" lang="en">${w.en}</span>${flipped?`<span class="meaning">${w.ar}</span><small>${w.context}</small>`:'<small>اضغط لكشف المعنى</small>'}</button>${flipped?`<div class="row">${btn('تذكرتها ✓','rateFlash(true)')}${btn('أحتاج مراجعة','rateFlash(false)','secondary')}</div>`:btn('اكشف المعنى','flipped=true;render()','secondary')}<p class="sub" style="text-align:center;margin-top:20px">التقييم هنا ذاتي؛ اختبر نفسك بعد المراجعة.</p>`}
function rateFlash(ok){let id=flashItems[fi].id;if(ok){if(!state.known.includes(id))state.known.push(id);state.mistakes=state.mistakes.filter(i=>i!==id)}else{state.known=state.known.filter(i=>i!==id);if(!state.mistakes.includes(id))state.mistakes.push(id)}save();fi++;flipped=false;render()}
const situations=[['تريد حجز موعد بأدب.',"I’d like to make an appointment, please.","What a surprise!","Have a safe flight!","So do I."],['قابلت صديقًا دون توقع.','What a surprise!',"I’m afraid I disagree.",'He is booked up all week.','See you soon.'],['تعرّفت على شخص لأول مرة.','Pleased to meet you.','This is an emergency.','Could I see him sooner?','Exactly.'],['تريد تمني رحلة آمنة لصديق.','Have a safe flight.','I prefer Abha.','Let me introduce Badr.','I think that...'],['تريد إبداء رأيك.','In my opinion...','Can I make an appointment?','Good morning.','See you in London.'],['تريد الاختلاف بأدب.',"I see your point, but...",'I completely agree.','Great!','Have a pleasant trip.'],['تريد معرفة إمكانية تقديم الموعد.','Could I see him sooner?','This is my brother.','How are you doing?','What a surprise!'],['تريد إيصال تحياتك لعائلة صديق.','Please give my regards to your family.','I prefer Jeddah.','Can you make it this morning?','Is this for real?'],['تريد التعبير عن تفضيل.','I prefer...','I completely agree.','See you soon.','The doctor is available on Tuesday.'],['تريد التأكد أن موعد الخميس يناسب الطرف الآخر.','Can you make it on Thursday morning?','Have a good trip.','Say hello to your parents for me.','Pleased to meet you.'],['تتفق تمامًا مع رأي زميلك.','I completely agree.',"I’m afraid I disagree.",'I didn’t expect to run into you here.','Could I see her sooner?'],['تخبر المتصل أن المواعيد كلها محجوزة.','He is booked up all week.','Glad to meet you.','Have a safe flight.','I prefer...']];
function startQuiz(type){if(type==='listen'&&!('speechSynthesis'in window)){toast('الاستماع غير متاح هنا. جرّب اختبار المعاني.');return}let questions=type==='situations'?shuffle(situations).slice(0,10).map(s=>({prompt:s[0],correct:s[1],options:shuffle(s.slice(1)),id:null})):shuffle(DATA.vocab).slice(0,10).map(w=>({prompt:w.en,correct:w.ar,options:shuffle([w.ar,...shuffle(DATA.vocab.filter(x=>x.id!==w.id&&x.ar!==w.ar)).slice(0,3).map(x=>x.ar)]),id:w.id}));quiz={type,questions,index:0,answers:[],selected:null,finished:false};go('quiz')}
function quizPage(){if(quiz.finished){let score=quiz.answers.filter(a=>a.ok).length;return head('نتيجة التحدي','كل خطأ فرصة للمراجعة')+`<div class="card"><div class="score">${score}/10</div><h2 style="text-align:center">${score>=8?'أداء جيد، واصل الممارسة':'راجع الأخطاء ثم حاول مجددًا'}</h2><p class="sub" style="text-align:center">${quiz.type==='situations'?'اختبار المواقف':quiz.type==='listen'?'تحدي الاستماع':'اختبار المعاني'} • الإجابات الأولى</p></div>${quiz.answers.filter(a=>!a.ok).map(a=>`<div class="card"><p ${quiz.type==='situations'?'':'class="en" lang="en"'}>${esc(a.q.prompt)}</p><p class="sub">إجابتك: ${esc(a.chosen)}</p><p style="color:var(--green)">الصحيح: ${esc(a.q.correct)}</p></div>`).join('')}${btn('محاولة جديدة',`startQuiz('${quiz.type}')`)}<div style="margin-top:10px">${btn('عرض تقدمي',"go('progress')",'secondary')}</div>`}let q=quiz.questions[quiz.index];return head(quiz.type==='situations'?'ماذا تقول؟':quiz.type==='listen'?'تحدي الاستماع':'اختبار المعاني','اختر إجابة واحدة')+`<div class="row"><span class="pill">السؤال ${quiz.index+1} / 10</span><span class="sub">${quiz.answers.filter(a=>a.ok).length} إجابات صحيحة</span></div><div class="progress"><i style="width:${quiz.index*10}%"></i></div><div class="card">${quiz.type==='listen'?`<p>استمع، ثم اختر المعنى الصحيح.</p>${btn('تشغيل الكلمة',`sayWord(${q.id})`,'secondary','sound')}`:`<p class="${quiz.type==='meaning'?'en word':''}" ${quiz.type==='meaning'?'lang="en"':''}>${esc(q.prompt)}</p>`}</div><div class="stack">${q.options.map((o,i)=>`<button class="option ${quiz.type==='situations'?'en':''} ${quiz.selected!==null?(o===q.correct?'correct':i===quiz.selected?'wrong':''):''}" ${quiz.selected!==null?'disabled':''} onclick="answer(${i})">${esc(o)}</button>`).join('')}</div>${quiz.selected!==null?`<div class="feedback" role="status">${q.options[quiz.selected]===q.correct?'✓ إجابة صحيحة':'الإجابة الصحيحة: '+esc(q.correct)}</div>${btn(quiz.index===9?'عرض النتيجة':'السؤال التالي','nextQuestion()')}`:''}`}
function answer(i){if(quiz.selected!==null)return;quiz.selected=i;const q=quiz.questions[quiz.index],ok=q.options[i]===q.correct;quiz.answers.push({q,chosen:q.options[i],ok});if(!ok&&q.id!==null&&!state.mistakes.includes(q.id))state.mistakes.push(q.id);save();render()}
function nextQuestion(){if(quiz.finished||quiz.selected===null)return;if(quiz.index===9){quiz.finished=true;state.attempts.push({type:quiz.type,score:quiz.answers.filter(a=>a.ok).length,date:new Date().toISOString()});save()}else{quiz.index++;quiz.selected=null}stop();render();window.scrollTo(0,0)}
function progressPage(){let last=state.attempts.at(-1),best=state.attempts.length?Math.max(...state.attempts.map(a=>a.score)):null;return head('تقدمي','سجل شخصي محفوظ على هذا الجهاز')+`<div class="stats"><div class="stat"><strong>${state.known.length}/50</strong><span>كلمات راجعتها</span></div><div class="stat"><strong>${state.dialogs.length}/5</strong><span>محادثات تدرّبت عليها</span></div><div class="stat"><strong>${state.attempts.length}</strong><span>اختبارات مكتملة</span></div></div><div class="card"><h2>نتائج الاختبارات</h2><div class="settingsrow"><span>آخر نتيجة</span><strong>${last?last.score+'/10':'لم تختبر بعد'}</strong></div><div class="settingsrow"><span>أفضل نتيجة</span><strong>${best===null?'—':best+'/10'}</strong></div><p class="sub">النتائج تجمع أنواع اختبارات مختلفة؛ راجع نوع كل محاولة أدناه.</p></div>${state.mistakes.length?`<div class="note">لديك ${state.mistakes.length} كلمة تحتاج مراجعة.</div>${btn('راجع هذه الكلمات',"startFlash('mistakes')",'secondary')}`:''}<div class="sectionhead"><h2>آخر المحاولات</h2></div>${state.attempts.slice(-10).reverse().map(a=>`<div class="card row"><div><h3>${({meaning:'معاني الكلمات',listen:'الاستماع',situations:'المواقف'})[a.type]}</h3><p class="sub">${new Date(a.date).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})}</p></div><strong>${a.score}/10</strong></div>`).join('')||'<div class="empty">ابدأ أول اختبار لتظهر نتائجك هنا.</div>'}<div class="stack">${btn('تنزيل تقرير التقدم','exportReport()','secondary','chart')}${btn('نسخة احتياطية للتقدم','backup()','secondary')}</div>`}
function settingsPage(){return head('الإعدادات','اجعل التدريب مناسبًا لك')+`<div class="card"><h2>الاسم في تقرير التقدم</h2><input class="search" style="margin:12px 0 0" maxlength="60" aria-label="اسم المتعلم" placeholder="اسم المتعلم (اختياري)" value="${esc(state.name)}" onchange="state.name=this.value;save()"></div><div class="card"><div class="settingsrow"><span>المظهر الداكن</span><button class="toggle" aria-pressed="${state.dark}" onclick="state.dark=!state.dark;save();render()">${state.dark?'مفعّل':'غير مفعّل'}</button></div><div class="settingsrow"><span>خط أكبر</span><button class="toggle" aria-pressed="${state.large}" onclick="state.large=!state.large;save();render()">${state.large?'مفعّل':'غير مفعّل'}</button></div><div class="settingsrow"><label for="rate">سرعة النطق</label><select id="rate" class="select" onchange="state.rate=Number(this.value);save()">${[.65,.85,1].map(r=>`<option value="${r}" ${state.rate===r?'selected':''}>${r===.65?'بطيء':r===.85?'هادئ':'عادي'}</option>`).join('')}</select></div><div class="settingsrow"><label for="voice">الصوت الإنجليزي</label><select id="voice" class="select" style="max-width:65%" onchange="state.voice=this.value;save()"></select></div>${btn('تجربة الصوت',"say('Hello! Pleased to meet you.')",'secondary','sound')}<p class="sub" style="margin-top:10px">الأصوات ودعم النطق دون إنترنت يختلفان بحسب الجهاز والمتصفح. المحتوى والتدريبات نفسها لا تحتاج اتصالًا.</p></div><div class="card"><h2>البيانات</h2><p class="sub">التقدم محلي في هذا المتصفح، ولا يتزامن بين الأجهزة. احتفظ بنسخة احتياطية لنقله.</p><div class="stack">${btn('تنزيل نسخة احتياطية','backup()','secondary')}<label class="secondary" style="cursor:pointer">استعادة نسخة احتياطية<input type="file" accept="application/json,.json" style="display:none" onchange="restore(this.files[0]);this.value='' "></label><button class="secondary danger" onclick="document.getElementById('resetDialog').showModal()">مسح التقدم</button></div></div><div class="card"><h2>عن المحتوى</h2><p class="sub">المصدر: 30-9.pdf. يضم 50 مفردة، و5 مجموعات من التعبيرات، و5 محادثات. أُضيفت ترجمة المحادثات وتدريبات تفاعلية لتنفيذ الغرض التعليمي. أرقام الإحالات داخل المصدر لم تتضمن قائمة مراجع، لذلك لم تُعرض كمراجع موثقة هنا.</p></div>`}
function populateVoices(){let s=document.getElementById('voice');if(!s)return;let voices='speechSynthesis'in window?speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en')):[];s.innerHTML='<option value="">تلقائي</option>'+voices.map(v=>`<option value="${esc(v.name)}" ${state.voice===v.name?'selected':''}>${esc(v.name)} (${v.lang})</option>`).join('')}if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=populateVoices;
function download(name,text,type){let url=URL.createObjectURL(new Blob([text],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function backup(){download('connect-progress.json',JSON.stringify({app:KEY,version:1,state},null,2),'application/json')}
async function restore(file){if(!file)return;try{let b=JSON.parse(await file.text()),s=b.state;if(b.app!==KEY||!s||!['known','favorites','mistakes'].every(k=>Array.isArray(s[k])&&s[k].every(i=>Number.isInteger(i)&&i>=0&&i<50))||!Array.isArray(s.dialogs)||!s.dialogs.every(i=>Number.isInteger(i)&&i>=0&&i<5)||!Array.isArray(s.attempts)||!s.attempts.every(a=>['meaning','listen','situations'].includes(a.type)&&Number.isInteger(a.score)&&a.score>=0&&a.score<=10&&Number.isFinite(Date.parse(a.date)))||typeof s.name!=='string'||typeof s.dark!=='boolean'||typeof s.large!=='boolean'||![.65,.85,1].includes(s.rate)||typeof s.voice!=='string')throw Error();state={...blank(),...s,known:[...new Set(s.known)],favorites:[...new Set(s.favorites)],mistakes:[...new Set(s.mistakes)],dialogs:[...new Set(s.dialogs)],name:s.name.slice(0,60)};save();render();toast('تمت استعادة تقدم التعلم')}catch(e){toast('الملف غير صالح. اختر نسخة احتياطية صادرة من هذا التطبيق.')}}
function exportReport(){let t=`تقرير تقدم التعلم — Connect\n${state.name?'المتعلم: '+state.name+'\n':''}التاريخ: ${new Date().toLocaleDateString('ar-EG')}\nالكلمات التي تمت مراجعتها ذاتيًا: ${state.known.length}/50\nالمحادثات المتدرّب عليها: ${state.dialogs.length}/5\nالاختبارات المكتملة: ${state.attempts.length}\n\nنتائج الاختبارات:\n`+state.attempts.map(a=>`${new Date(a.date).toLocaleDateString('ar-EG')} | ${{meaning:'معاني',listen:'استماع',situations:'مواقف'}[a.type]} | ${a.score}/10`).join('\n')+'\n\nكلمات تحتاج مراجعة:\n'+state.mistakes.map(i=>DATA.vocab[i].en+' — '+DATA.vocab[i].ar).join('\n')+'\n\nهذه نتائج تدريب داخل التطبيق، وليست تقييمًا رسميًا للمستوى.';download('connect-report.txt','\ufeff'+t,'text/plain;charset=utf-8')}
function resetAll(){stop();state=blank();save();document.querySelector('dialog').close();go('home');toast('تم مسح التقدم')}
document.getElementById('brandicon').innerHTML=ico('book');document.getElementById('settingsicon').innerHTML=ico('settings');render();
</script></body></html>
